<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Analog Places</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --bg: #05070d; --panel: #0d1220; --line: #222c44; --text: #e6ebf5; --muted: #8f9bb6;
      --mars: #e3794b; --moon: #c3cad8; --both: #3ec7b4; --strong: #4fc37a; --partial: #e5b54a; --weak: #e2615a; --team: #b48cff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
    canvas { display: block; }
    #legend {
      position: fixed; left: 16px; top: 16px; background: rgba(13,18,32,.85); border: 1px solid var(--line);
      border-radius: 8px; padding: 10px 14px; font-size: 13px; line-height: 1.7;
    }
    #legend h1 { font-size: 15px; margin: 0 0 4px; }
    #legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
    #legend .count { color: var(--muted); }
    #legend label { cursor: pointer; display: block; }
    #tip {
      position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
      border-radius: 6px; padding: 6px 10px; font-size: 12.5px; white-space: nowrap; display: none;
      box-shadow: 0 6px 20px rgba(0,0,0,.5);
    }
    #tip .m { color: var(--muted); }
    #card {
      position: fixed; right: 16px; top: 16px; width: 340px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px);
      overflow-y: auto; background: rgba(13,18,32,.95); border: 1px solid var(--line); border-radius: 8px;
      padding: 14px 16px; font-size: 13px; line-height: 1.45; display: none;
    }
    #card h2 { font-size: 16px; margin: 0 24px 2px 0; }
    #card h3 { font-size: 13px; margin: 14px 0 4px; }
    #card .sub { color: var(--muted); margin: 0 0 8px; }
    #card ul { margin: 2px 0; padding-left: 18px; }
    #card .close { position: absolute; right: 10px; top: 8px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
    .bar { display: grid; grid-template-columns: 80px 1fr 32px; gap: 8px; align-items: center; margin: 3px 0; }
    .bar .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
    .bar .fill { height: 100%; background: var(--both); }
    .bar .v { text-align: right; color: var(--muted); }
    .same { color: var(--strong); } .partly { color: var(--partial); } .different { color: var(--weak); }
    .badge.team { color: var(--team); border-color: var(--team); }
    .tb { color: var(--team); font-weight: 600; }
    #card table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 12.5px; }
    #card td { padding: 3px 4px; border-top: 1px solid var(--line); }
    #card td.n { text-align: right; font-variant-numeric: tabular-nums; }
    #card a { color: var(--both); }
    .rt { color: var(--muted); margin: 2px 0 0; }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11.5px; margin-right: 4px; border: 1px solid var(--line); }
    #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 12px; }
    @media (max-width: 600px) {
      #card { top: auto; bottom: 16px; max-height: 50vh; }
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="legend">
    <h1>Earth analog places</h1>
    <label><input type="checkbox" data-k="Mars" checked> <span class="dot" style="background:var(--mars)"></span>Mars <span class="count" id="c-Mars"></span></label>
    <label><input type="checkbox" data-k="Moon" checked> <span class="dot" style="background:var(--moon)"></span>Moon <span class="count" id="c-Moon"></span></label>
    <label><input type="checkbox" data-k="Both" checked> <span class="dot" style="background:var(--both)"></span>Mars &amp; Moon <span class="count" id="c-Both"></span></label>
    <label><input type="checkbox" id="teamOnly"> <span class="dot" style="background:transparent;border:2px solid var(--team)"></span>Only #team <span class="count" id="c-team"></span></label>
    <label><input type="checkbox" id="spin" checked> Auto-rotate</label>
  </div>
  <div id="tip"></div>
  <div id="card"></div>
  <div id="hint">Drag to rotate · scroll to zoom · click a point for details</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const COLORS = { Mars: 0xe3794b, Moon: 0xc3cad8, Both: 0x3ec7b4 };
    const R = 2;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070d);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 1.8);
    sun.position.set(-6, 4, 8);
    scene.add(sun);

    const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 500);
    camera.position.set(0, 1.5, 7);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 2.6;
    controls.maxDistance = 20;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // stars
    {
      const n = 2500, pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const v = new THREE.Vector3().randomDirection().multiplyScalar(120 + Math.random() * 80);
        pos.set([v.x, v.y, v.z], i * 3);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8899bb, size: 0.35 })));
    }

    // earth
    const earthMat = new THREE.MeshStandardMaterial({ color: 0x2a4a7a, roughness: 0.95, metalness: 0 });
    new THREE.TextureLoader().load("textures/earth.jpg", (t) => {
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      earthMat.map = t; earthMat.color.set(0xffffff); earthMat.needsUpdate = true;
    });
    const earth = new THREE.Mesh(new THREE.SphereGeometry(R, 128, 96), earthMat);
    scene.add(earth);

    function latLonToVec(latDeg, lonDeg, r) {
      // matches THREE.SphereGeometry UVs for an equirectangular map spanning -180..180
      const lat = THREE.MathUtils.degToRad(latDeg), lon = THREE.MathUtils.degToRad(lonDeg);
      return new THREE.Vector3(r * Math.cos(lat) * Math.cos(lon), r * Math.sin(lat), -r * Math.cos(lat) * Math.sin(lon));
    }

    const kindOf = (p) => p.targets.length > 1 ? "Both" : p.targets[0];
    const markers = [];
    const hidden = new Set();

    const res = await fetch("data/places_all.json");
    const places = await res.json();
    // terrain comparisons with the Moon / Mars sites (scripts/analyze.py); optional
    const results = await fetch("data/results.json").then((r) => r.ok ? r.json() : null).catch(() => null);
    const isTeam = (p) => (p.labels || []).includes("team");
    let teamOnly = false;
    const counts = { Mars: 0, Moon: 0, Both: 0 };

    for (const p of places) {
      const kind = kindOf(p);
      counts[kind]++;
      const size = p.featured ? 0.045 : 0.03;
      const m = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 12), new THREE.MeshBasicMaterial({ color: COLORS[kind] }));
      m.position.copy(latLonToVec(p.lat, p.lon, R * 1.004));
      m.userData = { place: p, kind, team: isTeam(p) };
      earth.add(m);
      markers.push(m);
      if (isTeam(p)) { // purple halo marks the team's places
        const halo = new THREE.Mesh(new THREE.RingGeometry(size * 1.15, size * 1.55, 32),
          new THREE.MeshBasicMaterial({ color: 0xb48cff, side: THREE.DoubleSide }));
        halo.position.copy(latLonToVec(p.lat, p.lon, R * 1.003));
        halo.lookAt(halo.position.clone().multiplyScalar(2));
        m.userData.halo = halo;
        earth.add(halo);
      }
      if (p.featured) { // ring around featured places
        const ring = new THREE.Mesh(new THREE.RingGeometry(size * 1.8, size * 2.3, 32),
          new THREE.MeshBasicMaterial({ color: COLORS[kind], side: THREE.DoubleSide, transparent: true, opacity: 0.8 }));
        ring.position.copy(latLonToVec(p.lat, p.lon, R * 1.002));
        ring.lookAt(ring.position.clone().multiplyScalar(2));
        m.userData.ring = ring;
        earth.add(ring);
      }
    }
    for (const k in counts) document.getElementById("c-" + k).textContent = `(${counts[k]})`;
    document.getElementById("c-team").textContent = `(${places.filter(isTeam).length})`;

    function applyFilter() {
      for (const m of markers) {
        const v = !hidden.has(m.userData.kind) && (!teamOnly || m.userData.team);
        m.visible = v;
        if (m.userData.ring) m.userData.ring.visible = v;
        if (m.userData.halo) m.userData.halo.visible = v;
      }
    }
    document.querySelectorAll("#legend input[data-k]").forEach((cb) => cb.addEventListener("change", () => {
      cb.checked ? hidden.delete(cb.dataset.k) : hidden.add(cb.dataset.k);
      applyFilter();
    }));
    document.getElementById("teamOnly").addEventListener("change", (e) => { teamOnly = e.target.checked; applyFilter(); });
    document.getElementById("spin").addEventListener("change", (e) => controls.autoRotate = e.target.checked);

    // picking
    const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
    const tip = document.getElementById("tip"), card = document.getElementById("card");
    let hovered = null, downAt = null;

    function pick(ev) {
      mouse.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
      ray.setFromCamera(mouse, camera);
      const hit = ray.intersectObjects([earth, ...markers.filter((m) => m.visible)], false)[0];
      return hit && hit.object !== earth ? hit.object : null; // earth blocks points on the far side
    }

    function setHover(m) {
      if (hovered === m) return;
      if (hovered) hovered.scale.setScalar(1);
      hovered = m;
      if (m) m.scale.setScalar(1.6);
      renderer.domElement.style.cursor = m ? "pointer" : "";
    }

    renderer.domElement.addEventListener("pointermove", (ev) => {
      const m = pick(ev);
      setHover(m);
      if (!m) { tip.style.display = "none"; return; }
      const p = m.userData.place;
      const match = Object.entries(p.match).map(([k, v]) => `${k} ${v}%`).join(" · ");
      tip.innerHTML = `${isTeam(p) ? '<span class="tb">#team</span> ' : ""}<b>${esc(p.region || "Unnamed place")}</b><br><span class="m">${match}</span>`;
      tip.style.display = "block";
      tip.style.left = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
      tip.style.top = (ev.clientY + 14) + "px";
    });
    renderer.domElement.addEventListener("pointerdown", (ev) => downAt = [ev.clientX, ev.clientY]);
    renderer.domElement.addEventListener("pointerup", (ev) => {
      if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return; // was a drag
      const m = pick(ev);
      if (m) showCard(m.userData.place);
    });

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const list = (items, cls) => items.length ? `<ul class="${cls}">${items.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : "";
    const LABELS = { cold: "Cold", swing: "Day/night swing", no_plants: "No plants", flat: "Flat", dust: "Dust" };

    function showCard(p) {
      const bars = Object.entries(p.scores).map(([k, v]) =>
        `<div class="bar"><span>${LABELS[k] || k}</span><div class="track"><div class="fill" style="width:${v}%"></div></div><span class="v">${v}</span></div>`).join("");
      const regionType = { Mars: p.marsRegionType, Moon: p.moonRegionType };
      const targets = p.targets.map((t) => `
        <h3>${t} — ${p.match[t]}% match</h3>
        ${regionType[t] ? `<p class="rt"><b>Like: ${esc(regionType[t].name)}</b> (${esc(regionType[t].example)}). ${esc(regionType[t].why)}</p>` : ""}
        ${list(p.text[t].same, "same")}${list(p.text[t].partly, "partly")}${list(p.text[t].different, "different")}`).join("");
      card.innerHTML = `
        <button class="close" aria-label="Close">×</button>
        <h2>${esc(p.region || "Unnamed place")}</h2>
        <p class="sub">${p.lat.toFixed(2)}°, ${p.lon.toFixed(2)}°
          ${isTeam(p) ? `<span class="badge team">#team</span>` : ""}
          ${p.regionGroup ? `<span class="badge">${esc(p.regionGroup)}</span>` : ""}
          ${p.featured ? `<span class="badge">Featured: ${esc(p.featuredType)}</span>` : ""}</p>
        ${bars}
        ${targets}
        ${terrainTable(p)}
        ${p.notes && p.notes.length ? `<h3>Notes</h3>${list(p.notes, "")}` : ""}`;
      card.style.display = "block";
      card.querySelector(".close").onclick = () => card.style.display = "none";
    }

    // terrain similarity (slope, roughness, ...) with each Moon / Mars site, from results.json
    function terrainTable(p) {
      if (!p.site_id || !results) return "";
      const rows = results.comparisons.filter((c) => c.earth === p.site_id)
        .sort((a, b) => b.overall - a.overall);
      if (!rows.length) return `<h3>Terrain vs Moon &amp; Mars sites</h3><p class="rt">Not analysed yet: run scripts/fetch_dems.py and scripts/analyze.py.</p>`;
      const col = { strong: "var(--strong)", partial: "var(--partial)", weak: "var(--weak)" };
      return `<h3>Terrain vs Moon &amp; Mars sites</h3><table>${rows.map((c) => {
        const t = results.sites[c.target];
        return `<tr><td><a href="index.html#compare/${encodeURIComponent(c.earth)}/${encodeURIComponent(c.target)}">${esc(t.name)}</a></td>
          <td style="color:var(--${t.body})">${t.body === "moon" ? "Moon" : "Mars"}</td>
          <td class="n" style="color:${col[c.verdict]}">${Math.round(c.overall * 100)}%</td></tr>`;
      }).join("")}</table><p class="rt">Terrain only (30 km window). Click a site to compare in 3D.</p>`;
    }

    function resize() {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    addEventListener("resize", resize);
    resize();

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
